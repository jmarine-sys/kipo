<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#194E59" />
    <title>Kipo</title>
    <!-- El ?v= existe para romper el cache: los navegadores guardan el favicon
         con una terquedad que sobrevive a recargas normales y hasta a borrar
         datos del sitio. Subir el numero es la unica forma confiable. -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=2" />
    <!-- Respaldo en PNG: algunos navegadores todavia no dibujan bien un favicon
         vectorial con gradientes. -->
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kipo" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
